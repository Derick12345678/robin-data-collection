[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robin-data-collection"
version = "0.2.0"
description = "Bounded Robin metadata collection, sanitized observations, and review workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robin-collect = "robin_collect.cli:main"
robin-limits = "robin_collect.limits:main"

[tool.setuptools.packages.find]
where = ["src"]
