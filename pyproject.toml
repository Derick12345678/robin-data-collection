[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robin-data-collection"
version = "0.1.0"
description = "Team scaffold for reproducible Robin result collection and sanitized CSV preparation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robin-collect = "robin_collect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
